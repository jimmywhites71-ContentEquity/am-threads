name: Browser collect

# Reads houses whose sites refuse our plain reader (Blackstone, KKR) in a real browser, respecting
# robots.txt, and stores new pieces for the normal pipeline to tag. Files the log to the "Browser
# collect" issue. No AI cost.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      managers: { description: 'House ids, comma separated', required: false, default: 'blackstone,kkr,oaktree,carlyle' }
      probe: { description: 'yes = only list what would be collected', required: false, default: 'no' }
      max: { description: 'Most new pieces per house', required: false, default: '120' }

permissions:
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Collect
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_CONTACT_URL: ${{ vars.BOT_CONTACT_URL }}
        run: |
          set -o pipefail
          P=""; [ "${{ github.event.inputs.probe }}" = "yes" ] && P="--probe"
          npm run browser-collect -- --managers "${{ github.event.inputs.managers || 'blackstone,kkr,oaktree,carlyle' }}" --max "${{ github.event.inputs.max || '120' }}" $P 2>&1 | tee collect.log
      - name: File the result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Run $(date -u '+%Y-%m-%d %H:%M') UTC: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo; echo '```'; tail -n 80 collect.log 2>/dev/null || echo "(no log)"; echo '```'; } > body.md
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Browser collect in:title" --json number,title --jq '[.[] | select(.title == "Browser collect")][0].number // empty')
          if [ -n "$n" ]; then gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --body-file body.md; else gh issue create --repo "$GITHUB_REPOSITORY" --title "Browser collect" --body-file body.md; fi
