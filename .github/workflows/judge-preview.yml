name: Judging screenshot preview
# Diagnostic: copies a few judging screenshots of a set to the judge-previews branch, to check them.
on:
  workflow_dispatch:
    inputs:
      set: { description: 'Set id', required: true }
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund @supabase/supabase-js
      - env:
          GH_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p previews
          node -e "
          const { createClient } = require('@supabase/supabase-js'); const fs = require('fs')
          const sb = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY)
          ;(async () => {
            const { data } = await sb.from('cj_items').select('n, piece_id').eq('set_id', '${{ inputs.set }}').order('n').limit(3)
            for (const it of data) for (const k of ['top', 'page']) {
              const { data: f } = await sb.storage.from('captures').download('judge/' + it.piece_id + '/' + k + '.jpg')
              if (f) fs.writeFileSync('previews/' + it.n + '-' + k + '.jpg', Buffer.from(await f.arrayBuffer()))
            }
          })()"
          ls -la previews
          gh api -X DELETE repos/$GITHUB_REPOSITORY/git/refs/heads/judge-previews || true
          gh api repos/$GITHUB_REPOSITORY/git/refs -f ref=refs/heads/judge-previews -f sha=$GITHUB_SHA
          for f in previews/*.jpg; do base64 -w0 "$f" > b64.txt; gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$f" -f message="preview" -f branch=judge-previews -F content=@b64.txt >/dev/null; done
