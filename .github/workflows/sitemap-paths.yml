name: Sitemap paths
# Diagnostic: lists the most common path prefixes in a site's sitemap, to find where its articles live.
on:
  workflow_dispatch:
    inputs:
      urls: { description: 'Sitemap addresses, space separated', required: true }
jobs:
  paths:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="AMIntelligenceBot/0.1 (+https://contentequity.co.uk/#contact)"
          for u in ${{ inputs.urls }}; do
            echo "== $u"
            curl -sSL -m 30 -A "$UA" "$u" > s.xml || true
            # follow one level of sitemap index
            if grep -q "<sitemapindex" s.xml; then for k in $(grep -oE "<loc>[^<]+" s.xml | sed 's/<loc>//' | head -20); do curl -sSL -m 30 -A "$UA" "$k"; done > all.xml; else cp s.xml all.xml; fi
            grep -oE "<loc>[^<]+" all.xml | sed 's/<loc>//' | grep -vE "/(en|de|fr|it|es|nl)-[a-z]{2}/" > locs.txt
            echo "addresses: $(wc -l < locs.txt)"
            awk -F/ '{print $4"/"$5}' locs.txt | sort | uniq -c | sort -rn | head -25
            grep -iE "insight|article|news|blog|comment|view|perspective|outlook|market" locs.txt | head -8
          done
